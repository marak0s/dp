[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "comm-ai"
version = "0.1.0"
description = "Neural Viterbi vs Neural BCJR for convolutional codes over AWGN"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "comm-ai"}]
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "matplotlib>=3.7",
  "tqdm>=4.66",
  "PyYAML>=6.0",
  "pandas>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
